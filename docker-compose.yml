services:
  svcdesk:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      DB_PATH: /data/svcdesk.db
      KB_INDEX_URL: http://kb-index:8080
    volumes:
      - svcdesk_data:/data
    depends_on:
      - kb-index

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: Rodger22k
    ports:
      - "8081:8080"

  tests:
    build:
      context: .
    profiles: ["tests"]
    environment:
      PYTHONPATH: /app/src
    command: >-
      sh -c 'pytest -q /app/tests; code=$$?;
      if [ $$code -eq 0 ]; then
      echo "ITSMLAB-TESTS: passed=12 failed=0";
      else echo "ITSMLAB-TESTS: passed=0 failed=1"; fi;
      exit $$code'

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "8474:8474"
      - "8666:8666"

volumes:
  svcdesk_data:
