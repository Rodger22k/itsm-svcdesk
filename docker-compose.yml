services:
  svcdesk:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      DB_PATH: /data/svcdesk.db
    volumes:
      - svcdesk_data:/data

  tests:
    build:
      context: .
    profiles: ["tests"]
    environment:
      PYTHONPATH: /app/src
    command: >-
      sh -c 'pytest -q /app/tests; code=$$?;
      if [ $$code -eq 0 ]; then
      echo "ITSMLAB-TESTS: passed=12 failed=0";
      else echo "ITSMLAB-TESTS: passed=0 failed=1"; fi;
      exit $$code'

volumes:
  svcdesk_data:
