rules:
  - id: svcdesk-sync-store-call-in-async
    languages: [python]
    severity: WARNING
    message: A synchronous TicketStore call inside async code can block the service worker
    patterns:
      - pattern-either:
          - pattern: store.create(...)
          - pattern: store.get(...)
